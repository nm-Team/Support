[project]
name = "nmteam-support"
version = "0.1.0"
description = "nmTeam Support 文档站构建工具链"
requires-python = ">=3.14"
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "mdformat>=1.0",
    "mdformat-front-matters>=2.0",
    "mdformat-mkdocs>=5.2.2",
    "pytest>=9.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmteam_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
