[project]
name = "nmteam-support"
version = "0.1.0"
description = "nmTeam Support 文档站构建工具链"
requires-python = ">=3.14"
dependencies = [
    "markdown>=3.10",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "pillow>=12.1.0",
    "pyyaml>=6.0.2",
    "typer>=0.21.1",
]

[project.scripts]
nmteam = "nmteam_support.cli:main"

[dependency-groups]
dev = [
    "mdformat>=1.0",
    "mdformat-front-matters>=2.0",
    "mdformat-mkdocs>=5.2.2",
    "pytest>=9.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmteam_support"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4", "RUF"]
ignore = ["E501"]
allowed-confusables = ["，", "。", "？", "：", "；", "！"]

[tool.ruff.lint.isort]
known-first-party = ["nmteam_support"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
